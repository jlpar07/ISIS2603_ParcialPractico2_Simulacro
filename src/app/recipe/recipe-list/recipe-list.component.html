
  
    
<div class = "container-fluid">
  <div class = "row">
    @for(recipe of recipes; track recipe.id){
    
    <div class="card p-2" style="width: 15rem; height: 30rem; margin: 3rem;">
      <img
        class="card-img-top recipe-img"
        [src]="recipe.imagen"
        alt="{{ recipe.imagen }}" style="height: 10rem; width: 10rem; align-self: center;"
      />
      <div class="card-body">
        <h5 class="card-title">{{ recipe.nombre }}</h5>
        <p class = "card-text">Porciones: {{ recipe.porciones }}</p>
        <p class = "card-text">Ingredientes: {{ recipe.ingredientes.length }}</p>
        <a class="btn btn-primary" href="/recipe/{{ recipe.id }}">Ver detalles</a>    <!--usar routerlink puede dar error al compilar, mejor usar href-->
        
      </div>
    </div>
    
    }
  </div>
</div>
